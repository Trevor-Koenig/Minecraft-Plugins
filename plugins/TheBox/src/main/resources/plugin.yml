main: tech.shulker.thebox.TheBox
version: '${version}'
name: TheBox
author: Trevor Koenig
description: A Shulker Tech Prison Paper plugin!
api-version: '26.3'

depend: [WorldEdit, WorldGuard, Vault, LuckPerms]
# softdepend only orders loading: these enable first if installed. Multiverse-Core must load its worlds
# before TheBox reads mines.yml and markets.yml; PlaceholderAPI must be up for TheBox to register its placeholders.
softdepend: [QuickShop-Hikari, Multiverse-Core, PlaceholderAPI]

permissions:
  thebox.admin:
    description: Use all /thebox admin commands
    default: op
  thebox.market.rent:
    description: Rent a market stall (grant it to the rank that unlocks renting)
    default: op
  # Rank effects, switched on and off with /effects. default false: ops don't get them unless a rank grants them.
  thebox.effect.night_vision:
    description: Night Vision everywhere (grant it to the rank that unlocks it)
    default: false
  thebox.effect.speed.1:
    description: Speed I
    default: false
  thebox.effect.speed.2:
    description: Speed II
    default: false
  # Per-mine access (thebox.mine.<id>) isn't listed here because mine ids are created in-game.
  # Neither is per-market access (thebox.marketplace.<id>), for the same reason.
  # Cell sizes (thebox.cell.size.<n>, n = 2, 3, ...) aren't either: how many there are depends on cells.yml.
  # Undeclared permissions default to op-only; ranks will grant them to players later.

